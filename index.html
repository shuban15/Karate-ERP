<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karate ERP - Students</title>
    <style>
        :root {
            --bg-1: #03150f;
            --bg-2: #0b2f23;
            --panel: rgba(10, 34, 26, 0.6);
            --panel-strong: rgba(15, 52, 39, 0.75);
            --line: rgba(136, 255, 200, 0.28);
            --primary: #32d296;
            --primary-strong: #21ae7d;
            --dark: #dffef0;
            --soft: #b8f0d6;
            --glow: rgba(87, 255, 186, 0.42);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(78, 255, 179, 0.25), transparent 32%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            color: var(--dark);
        }
        .container {
            width: min(100%, 980px);
            margin: 0 auto;
            background: rgba(10, 34, 26, 0.58);
            border: 1px solid var(--line);
            box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 30px;
            border-radius: 24px;
        }
        h2 {
            border-bottom: 2px solid rgba(136, 255, 200, 0.2);
            padding-bottom: 15px;
            color: var(--dark);
            font-size: 2em;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 0.04em;
            text-shadow: 0 0 18px rgba(87, 255, 186, 0.18);
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 20px;
            border: 1px solid rgba(143, 255, 202, 0.35);
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #062d1d;
            font-weight: 800;
            letter-spacing: 0.03em;
            transition: all 0.25s ease;
            box-shadow: 0 10px 25px rgba(50, 210, 150, 0.2), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(50, 210, 150, 0.28), 0 0 18px rgba(87, 255, 186, 0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(6, 22, 16, 0.35);
            border: 1px solid var(--line);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid rgba(136,255,200,0.12); }
        th {
            background: linear-gradient(135deg, rgba(38, 150, 103, 0.95), rgba(13, 89, 61, 0.82));
            color: #ecfff7;
            font-weight: 700;
        }
        .table-wrap { overflow-x: auto; }
        #studentTable a { color: #dffef0; text-decoration: none; }
        #studentTable a:hover { color: #ffffff; text-decoration: none; }
        #detailsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; }
        .modal-content {
            background: rgba(7, 25, 20, 0.8);
            border: 1px solid rgba(136,255,200,0.24);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 22px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
        }
        .delete-btn { background: linear-gradient(135deg, #ff7a7a, #e34848); color: white; }
        .edit-btn { background: linear-gradient(135deg, #42e0a0, #1ea86c); color: #062d1d; margin-right: 10px; }
        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%; padding: 12px 14px; margin: 8px 0; border-radius: 10px; font-size: 14px; box-sizing: border-box;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(136,255,200,0.22);
            color: var(--dark);
        }
        input::placeholder { color: rgba(223,254,240,0.7); }
        input:focus, select:focus { outline: none; border-color: rgba(131,255,208,0.78); box-shadow: 0 0 0 4px rgba(89, 255, 176, 0.12); }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .modal-buttons button { margin: 0; flex: 1; }
        @media (max-width: 640px) { .container { padding: 20px 15px; } h2 { font-size: 1.5rem; } .modal-buttons { flex-direction: column; } }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="container">
    <h2>Karate Class ERP - Students</h2>
    <div class="nav">
        <button onclick="window.location='fees.html'">Fees</button>
        <button onclick="window.location='attendance.html'">Attendance</button>
        <button onclick="window.location='add-student.html'">Add Student</button>
    </div>

    <div class="table-wrap">
        <table id="studentTable">
            <thead><tr><th>Name</th><th>Age</th><th>Belt</th></tr></thead>
            <tbody id="studentListBody"></tbody>
        </table>
    </div>
</div>

<div id="detailsModal">
    <div class="modal-content">
        <h4 id="modalTitle">Student Details</h4>
        
        <!-- View Mode -->
        <div id="viewMode">
            <p><strong>Name:</strong> <span id="detailName"></span></p>
            <p><strong>Age:</strong> <span id="detailAge"></span></p>
            <p><strong>DOB:</strong> <span id="detailDob"></span></p>
            <p><strong>Phone:</strong> <span id="detailPhone"></span></p>
            <p><strong>Belt:</strong> <span id="detailBelt"></span></p>
            <div class="modal-buttons">
                <button onclick="enableEditMode()" class="edit-btn">Edit</button>
                <button onclick="deleteStudent()" class="delete-btn">Delete</button>
                <button onclick="closeModal()">Close</button>
            </div>
        </div>

        <!-- Edit Mode -->
        <div id="editMode" style="display: none;">
            <input type="text" id="editName" placeholder="Name">
            <input type="number" id="editAge" placeholder="Age">
            <input type="date" id="editDob" placeholder="DOB">
            <input type="text" id="editPhone" placeholder="Phone">
            <select id="editBelt">
                <option value="White">White</option>
                <option value="Yellow">Yellow</option>
                <option value="Orange">Orange</option>
                <option value="Green">Green</option>
                <option value="Blue">Blue</option>
                <option value="Purple">Purple</option>
                <option value="Brown">Brown</option>
                <option value="Black">Black</option>
            </select>
            <div class="modal-buttons">
                <button onclick="saveChanges()" style="background: #059669;">Save</button>
                <button onclick="disableEditMode()">Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCUxp8HM1zzMc4QhbTRlCf7IE-wfgrsRj8",
        authDomain: "karate-erp.firebaseapp.com",
        projectId: "karate-erp",
        storageBucket: "karate-erp.firebasestorage.app",
        messagingSenderId: "331828306445",
        appId: "1:331828306445:web:c261e315d831d04ebf6b44",
        measurementId: "G-FS8YT8J1VD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let students = [];
    let currentStudentId = null;

    onSnapshot(collection(db, "students"), (snapshot) => {
        students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        updateUI();
    });

    function updateUI() {
        const tbody = document.getElementById('studentListBody');
        tbody.innerHTML = '';
        const beltOrder = ['White', 'Yellow', 'Orange', 'Green', 'Blue', 'Purple', 'Brown', 'Black'];
        const sortedStudents = [...students].sort((a, b) => {
            return beltOrder.indexOf(a.belt) - beltOrder.indexOf(b.belt);
        });
        sortedStudents.forEach(s => {
            tbody.innerHTML += `<tr>
                <td><a href="#" onclick="showDetails('${s.id}')">${s.name}</a></td>
                <td>${s.age}</td>
                <td>${s.belt}</td>
            </tr>`;
        });
    }

    window.showDetails = (id) => {
        const student = students.find(s => s.id === id);
        if (student) {
            document.getElementById('detailName').innerText = student.name;
            document.getElementById('detailAge').innerText = student.age;
            document.getElementById('detailDob').innerText = student.dob || 'N/A';
            document.getElementById('detailPhone').innerText = student.phone || 'N/A';
            document.getElementById('detailBelt').innerText = student.belt;
            currentStudentId = id;
            document.getElementById('detailsModal').style.display = 'flex';
        }
    };

    window.closeModal = () => {
        document.getElementById('detailsModal').style.display = 'none';
        currentStudentId = null;
    };

    window.deleteStudent = async () => {
        if (currentStudentId) {
            await deleteDoc(doc(db, "students", currentStudentId));
            closeModal();
        }
    };

    window.enableEditMode = () => {
        const student = students.find(s => s.id === currentStudentId);
        if (student) {
            document.getElementById('editName').value = student.name;
            document.getElementById('editAge').value = student.age;
            document.getElementById('editDob').value = student.dob || '';
            document.getElementById('editPhone').value = student.phone || '';
            document.getElementById('editBelt').value = student.belt;
            document.getElementById('viewMode').style.display = 'none';
            document.getElementById('editMode').style.display = 'block';
        }
    };

    window.disableEditMode = () => {
        document.getElementById('editMode').style.display = 'none';
        document.getElementById('viewMode').style.display = 'block';
    };

    window.saveChanges = async () => {
        if (currentStudentId) {
            const name = document.getElementById('editName').value;
            const age = document.getElementById('editAge').value;
            const dob = document.getElementById('editDob').value;
            const phone = document.getElementById('editPhone').value;
            const belt = document.getElementById('editBelt').value;
            
            if (name && age) {
                await updateDoc(doc(db, "students", currentStudentId), {
                    name: name,
                    age: age,
                    dob: dob,
                    phone: phone,
                    belt: belt
                });
                disableEditMode();
            }
        }
    };
</script>
</body>
</html>
