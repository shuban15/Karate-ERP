<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karate ERP - Add Student</title>
    <style>
        :root {
            --bg-1: #03150f;
            --bg-2: #0b2f23;
            --panel: rgba(10, 34, 26, 0.6);
            --line: rgba(136, 255, 200, 0.28);
            --primary: #32d296;
            --primary-strong: #21ae7d;
            --dark: #dffef0;
            --soft: #b8f0d6;
            --glow: rgba(87, 255, 186, 0.42);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(78, 255, 179, 0.25), transparent 32%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            color: var(--dark);
        }
        .container {
            width: min(100%, 980px);
            margin: 0 auto;
            background: rgba(10, 34, 26, 0.58);
            border: 1px solid var(--line);
            box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 30px;
            border-radius: 24px;
        }
        h2 {
            border-bottom: 2px solid rgba(136, 255, 200, 0.2);
            padding-bottom: 15px;
            color: var(--dark);
            font-size: 2em;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 0.04em;
            text-shadow: 0 0 18px rgba(87, 255, 186, 0.18);
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 20px;
            border: 1px solid rgba(143, 255, 202, 0.35);
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #062d1d;
            font-weight: 800;
            letter-spacing: 0.03em;
            transition: all 0.25s ease;
            box-shadow: 0 10px 25px rgba(50, 210, 150, 0.2), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(50, 210, 150, 0.28), 0 0 18px rgba(87, 255, 186, 0.2);
        }
        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(7, 25, 20, 0.38);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(136,255,200,0.22);
            color: var(--dark);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input::placeholder { color: rgba(223,254,240,0.7); }
        input:focus, select:focus {
            outline: none;
            border-color: rgba(131,255,208,0.78);
            box-shadow: 0 0 0 4px rgba(89, 255, 176, 0.12);
        }
        #addBtn { width: 100%; min-height: 52px; }
        @media (max-width: 640px) { .container { padding: 20px 15px; } h2 { font-size: 1.5rem; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Karate Class ERP - Add Student</h2>
    <div class="nav">
        <button onclick="window.location='index.html'">Students</button>
        <button onclick="window.location='attendance.html'">Attendance</button>
        <button onclick="window.location='fees.html'">Fees</button>
    </div>

    <div class="grid-form">
        <input type="text" id="sName" placeholder="Student Name">
        <input type="number" id="sAge" placeholder="Age">
        <input type="text" id="sPhone" placeholder="Phone Number">
        <input type="date" id="sDob" placeholder="Date of Birth">
        <select id="sBelt">
            <option value="White" selected>White</option>
            <option value="Yellow">Yellow</option>
            <option value="Orange">Orange</option>
            <option value="Green">Green</option>
            <option value="Blue">Blue</option>
            <option value="Purple">Purple</option>
            <option value="Brown">Brown</option>
            <option value="Black">Black</option>
        </select>
        <button id="addBtn" type="button">Add Student</button>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCUxp8HM1zzMc4QhbTRlCf7IE-wfgrsRj8",
        authDomain: "karate-erp.firebaseapp.com",
        projectId: "karate-erp",
        storageBucket: "karate-erp.firebasestorage.app",
        messagingSenderId: "331828306445",
        appId: "1:331828306445:web:c261e315d831d04ebf6b44",
        measurementId: "G-FS8YT8J1VD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('addBtn').onclick = async () => {
        const name = document.getElementById('sName').value || null;
        const age = document.getElementById('sAge').value || null;
        const phone = document.getElementById('sPhone').value || null;
        const dob = document.getElementById('sDob').value || null;
        const belt = document.getElementById('sBelt').value || null;

        if (!name || !age) {
            alert('Please enter both name and age before adding the student.');
            return;
        }

        try {
            await addDoc(collection(db, "students"), {
                name,
                age,
                phone,
                dob,
                belt,
                createdAt: serverTimestamp()
            });
            alert('Student added successfully.');
            document.getElementById('sName').value = '';
            document.getElementById('sAge').value = '';
            document.getElementById('sPhone').value = '';
            document.getElementById('sDob').value = '';
            document.getElementById('sBelt').value = 'White';
        } catch (error) {
            console.error('Add student failed:', error);
            alert('Could not add student. Check the console for details.');
        }
    };
</script>
</body>
</html>
